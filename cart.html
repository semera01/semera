<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart | LuxeScents & Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fcfcfc;
            color: #212529;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 15px;
            padding: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #3a0ca3;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            color: #7209b7;
            font-weight: 600;
        }
        td .quantity-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .remove-btn {
            background-color: #f72585;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 600;
        }
        .remove-btn:hover {
            background-color: #bd1550;
        }
        .total-row {
            font-weight: bold;
            font-size: 1.2rem;
            color: #4cc9f0;
        }
        .checkout-btn {
            margin-top: 25px;
            background-color: #f72585;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
            float: right;
        }
        .checkout-btn:hover {
            background-color: #bd1550;
        }
        .empty-msg {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 40px;
        }
        a.back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #7209b7;
            text-decoration: none;
            font-weight: 600;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Continue Shopping</a>
        <h1>Your Shopping Cart</h1>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Cart items go here -->
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3">Total</td>
                    <td id="totalPrice">$0.00</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
        <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        <p class="empty-msg" id="emptyMessage" style="display:none;">Your cart is empty.</p>
    </div>
<script>
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const tbody = document.querySelector('#cartTable tbody');
        const emptyMsg = document.getElementById('emptyMessage');
        tbody.innerHTML = '';

        if (cart.length === 0) {
            emptyMsg.style.display = 'block';
            document.getElementById('cartTable').style.display = 'none';
            document.getElementById('checkoutBtn').style.display = 'none';
            return;
        } else {
            emptyMsg.style.display = 'none';
            document.getElementById('cartTable').style.display = '';
            document.getElementById('checkoutBtn').style.display = '';
        }

        cart.forEach((item, index) => {
            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${item.name}</td>
                <td>$${item.price.toFixed(2)}</td>
                <td>
                    <input type="number" class="quantity-input" min="1" value="${item.quantity}" data-index="${index}">
                </td>
                <td>$${(item.price * item.quantity).toFixed(2)}</td>
                <td>
                    <button class="remove-btn" data-index="${index}">Remove</button>
                </td>
            `;

            tbody.appendChild(tr);
        });

        updateTotal();
        attachEventListeners();
    }

    function updateTotal() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        let total = 0;
        cart.forEach(item => {
            total += item.price * item.quantity;
        });
        document.getElementById('totalPrice').textContent = `$${total.toFixed(2)}`;
    }

    function attachEventListeners() {
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.addEventListener('change', (e) => {
                const index = e.target.getAttribute('data-index');
                let newQty = parseInt(e.target.value);
                if (isNaN(newQty) || newQty < 1) {
                    newQty = 1;
                    e.target.value = 1;
                }
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                cart[index].quantity = newQty;
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            });
        });

        document.querySelectorAll('.remove-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                const index = e.target.getAttribute('data-index');
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            });
        });
    }

document.getElementById('checkoutBtn').addEventListener('click', () => {
    window.location.href = 'checkout.html';
});

    loadCart();
</script>
</body>
</html>
