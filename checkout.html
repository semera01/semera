<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | LuxeScents & Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fcfcfc;
            color: #212529;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 15px;
            padding: 30px 40px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #3a0ca3;
            margin-bottom: 25px;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #7209b7;
        }
        input[type="text"], input[type="tel"], select {
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .payment-methods {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .payment-methods label {
            font-weight: normal;
            color: #444;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-details {
            display: none;
            flex-direction: column;
        }
        .card-details input {
            margin-bottom: 15px;
        }
        .submit-btn {
            background-color: #f72585;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-self: center;
            width: 100%;
            max-width: 300px;
        }
        .submit-btn:hover {
            background-color: #bd1550;
        }
        .confirmation {
            display: none;
            text-align: center;
            padding: 30px;
            background-color: #e4f0fb;
            border: 2px solid #4cc9f0;
            border-radius: 10px;
            color: #0d3c61;
            font-weight: 600;
            margin-top: 20px;
        }
        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: -15px;
            margin-bottom: 15px;
        }
        a.back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #7209b7;
            text-decoration: none;
            font-weight: 600;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="cart.html" class="back-link">&larr; Back to Cart</a>
        <h1>Checkout</h1>
        <form id="checkoutForm" novalidate>
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required />
            <div class="error" id="errorFullName"></div>

            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required pattern="\\+?[0-9\\- ]{7,15}" placeholder="+1234567890" />
            <div class="error" id="errorPhone"></div>

            <label for="address">Shipping Address *</label>
            <input type="text" id="address" name="address" required />
            <div class="error" id="errorAddress"></div>

            <label>Payment Method *</label>
            <div class="payment-methods">
                <label><input type="radio" name="paymentMethod" value="cash" required /> Cash</label>
                <label><input type="radio" name="paymentMethod" value="card" /> Card</label>
            </div>
            <div class="error" id="errorPaymentMethod"></div>

            <div class="card-details" id="cardDetails">
                <label for="cardNumber">Card Number *</label>
                <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9]{13,19}" placeholder="1234 5678 9012 3456" />
                <div class="error" id="errorCardNumber"></div>

                <label for="expiryDate">Expiry Date (MM/YY) *</label>
                <input type="text" id="expiryDate" name="expiryDate" pattern="^(0[1-9]|1[0-2])\\/\\d{2}$" placeholder="MM/YY" />
                <div class="error" id="errorExpiryDate"></div>

                <label for="cvv">CVV *</label>
                <input type="text" id="cvv" name="cvv" pattern="\\d{3,4}" placeholder="123" />
                <div class="error" id="errorCVV"></div>
            </div>

            <button type="submit" class="submit-btn">Place Order</button>
        </form>
        <div class="confirmation" id="confirmationMsg">
            Thank you for your order! Your purchase has been successfully processed.
        </div>
    </div>

<script>
    const paymentRadios = document.querySelectorAll('input[name="paymentMethod"]');
    const cardDetails = document.getElementById('cardDetails');

    paymentRadios.forEach(radio => {
        radio.addEventListener('change', () => {
            if (radio.value === 'card' && radio.checked) {
                cardDetails.style.display = 'flex';
                // Make card fields required
                document.getElementById('cardNumber').required = true;
                document.getElementById('expiryDate').required = true;
                document.getElementById('cvv').required = true;
            } else {
                cardDetails.style.display = 'none';
                // Remove required attribute
                document.getElementById('cardNumber').required = false;
                document.getElementById('expiryDate').required = false;
                document.getElementById('cvv').required = false;
            }
        });
    });

    const form = document.getElementById('checkoutForm');
    const confirmationMsg = document.getElementById('confirmationMsg');

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        clearErrors();

        const isValid = validateForm();
        if (!isValid) return;

        // Simulate order processing
        localStorage.removeItem('cart');
        form.style.display = 'none';
        confirmationMsg.style.display = 'block';
    });

    function clearErrors() {
        ['errorFullName', 'errorPhone', 'errorAddress', 'errorPaymentMethod', 'errorCardNumber', 'errorExpiryDate', 'errorCVV'].forEach(id => {
            document.getElementById(id).textContent = '';
        });
    }

    function validateForm() {
        let valid = true;

        // Full Name
        const fullName = form.fullName.value.trim();
        if (fullName === '') {
            showError('errorFullName', 'Full name is required.');
            valid = false;
        }

        // Phone
        const phone = form.phone.value.trim();
        if (phone === '') {
            showError('errorPhone', 'Phone number is required.');
            valid = false;
        } else if (!form.phone.checkValidity()) {
            showError('errorPhone', 'Please enter a valid phone number.');
            valid = false;
        }

        // Address
        const address = form.address.value.trim();
        if (address === '') {
            showError('errorAddress', 'Shipping address is required.');
            valid = false;
        }

        // Payment Method
        const selectedPayment = form.paymentMethod.value;
        if (!selectedPayment) {
            showError('errorPaymentMethod', 'Payment method is required.');
            valid = false;
        }

        if (selectedPayment === 'card') {
            // Card Number
            const cardNumber = form.cardNumber.value.trim();
            if (cardNumber === '') {
                showError('errorCardNumber', 'Card number is required.');
                valid = false;
            } else if (!form.cardNumber.checkValidity()) {
                showError('errorCardNumber', 'Card number must be 13 to 19 digits.');
                valid = false;
            }

            // Expiry Date
            const expiryDate = form.expiryDate.value.trim();
            if (expiryDate === '') {
                showError('errorExpiryDate', 'Expiry date is required.');
                valid = false;
            } else if (!form.expiryDate.checkValidity()) {
                showError('errorExpiryDate', 'Expiry date must be in MM/YY format.');
                valid = false;
            }

            // CVV
            const cvv = form.cvv.value.trim();
            if (cvv === '') {
                showError('errorCVV', 'CVV is required.');
                valid = false;
            } else if (!form.cvv.checkValidity()) {
                showError('errorCVV', 'CVV must be 3 or 4 digits.');
                valid = false;
            }
        }

        return valid;
    }

    function showError(id, message) {
        document.getElementById(id).textContent = message;
    }
</script>
</body>
</html>
