<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Details | LuxeScents & Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fcfcfc;
            color: #212529;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .product-image {
            flex: 1 1 300px;
            max-width: 400px;
        }
        .product-image img {
            width: 100%;
            border-radius: 10px;
            object-fit: contain;
        }
        .product-details {
            flex: 1 1 300px;
        }
        .product-details h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 15px;
            font-size: 2rem;
            color: #3a0ca3;
        }
        .product-details p.description {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }
        .price {
            font-weight: bold;
            font-size: 1.5rem;
            color: #7209b7;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #f72585;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #bd1550;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #7209b7;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 15px;
            font-weight: 600;
            color: #4cc9f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="product-image">
            <img id="productImage" src="" alt="Product Image" />
        </div>
        <div class="product-details">
            <h1 id="productName">Loading...</h1>
            <p class="description" id="productDescription"></p>
            <div class="price" id="productPrice"></div>
            <button class="btn" id="addToCartBtn"><i class="fas fa-shopping-cart"></i> Add to Cart</button>
            <div class="message" id="message"></div>
            <a href="index.html" class="back-link">&larr; Back to Products</a>
        </div>
    </div>

    <script>
        // Mock product data (in a real app, this might come from API or DB)
        const products = [
            {
                name: "Noir Essence",
                description: "A captivating fragrance with notes of amber and sandalwood",
                price: 89.99,
                image: "https://images.unsplash.com/photo-1592945403407-9de659572daa?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "Royal Chrono",
                description: "Automatic movement watch with sapphire crystal",
                price: 249.99,
                image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "Blossom Harmony",
                description: "Delicate floral scent with hints of jasmine and rose",
                price: 79.99,
                image: "https://images.unsplash.com/photo-1595425970377-2f8ded5e829a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                name: "Heritage Classic",
                description: "Vintage inspired watch with genuine leather strap",
                price: 199.99,
                image: "https://images.unsplash.com/photo-1539874754764-5a96559165b0?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Utility to get URL param by name
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadProduct() {
            const productName = getQueryParam('name');
            if (!productName) {
                document.getElementById('productName').textContent = "Product not found";
                return;
            }

            const product = products.find(p => p.name === productName);
            if (!product) {
                document.getElementById('productName').textContent = "Product not found";
                return;
            }

            document.getElementById('productName').textContent = product.name;
            document.getElementById('productDescription').textContent = product.description;
            document.getElementById('productPrice').textContent = `$${product.price.toFixed(2)}`;
            document.getElementById('productImage').src = product.image;
            document.getElementById('productImage').alt = product.name;
        }

        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existingIndex = cart.findIndex(item => item.name === product.name);
            if (existingIndex >= 0) {
                cart[existingIndex].quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        document.getElementById('addToCartBtn').addEventListener('click', () => {
            const productName = getQueryParam('name');
            const product = products.find(p => p.name === productName);
            if (!product) return;

            addToCart(product);

            const messageEl = document.getElementById('message');
            messageEl.textContent = "Added to cart!";
            setTimeout(() => {
                messageEl.textContent = "";
            }, 2000);
        });

        loadProduct();
    </script>
</body>
</html>
